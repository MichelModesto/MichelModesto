<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotações</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; --bg:#0d0d0d; --surface:#1a1a19; --text:#fff; --text-2:#c3c2b7; --muted:#898781; --good:#3ddc84; --bad:#ff5c5c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.3 -apple-system, "SF Pro", system-ui, sans-serif; display: flex; flex-direction: column; }
  main { flex: 1; display: grid; gap: 16px; padding: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-content: center; }
  .card { background: var(--surface); border-radius: 20px; padding: 28px 24px; text-align: center; }
  .code { color: var(--text-2); font-size: clamp(16px, 2vw, 22px); letter-spacing: .08em; }
  .bid { font-size: clamp(48px, 8vw, 110px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .bid small { font-size: .4em; color: var(--muted); font-weight: 400; margin-right: .1em; }
  .pct { font-size: clamp(16px, 2vw, 24px); font-variant-numeric: tabular-nums; }
  .up { color: var(--good); } .down { color: var(--bad); }
  footer { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; color: var(--muted); font-size: 13px; }
  footer input { background: var(--surface); color: var(--text); border: 1px solid #333; border-radius: 8px; padding: 6px 10px; width: 260px; font: inherit; }
  #status.err { color: var(--bad); }
</style>
</head>
<body>
<main id="grid"></main>
<footer>
  <span id="status">Carregando…</span>
  <label>Moedas <input id="moedas" placeholder="USD,EUR,GBP,CHF" title="Códigos separados por vírgula, todos contra BRL"></label>
</footer>
<script>
  const KEY = 'cotacao.moedas';
  const params = new URLSearchParams(location.search);
  let moedas = (params.get('m') || localStorage.getItem(KEY) || 'USD,EUR,GBP,CHF')
    .toUpperCase().replace(/[^A-Z,]/g, '').split(',').filter(Boolean);
  const inp = document.getElementById('moedas'), grid = document.getElementById('grid'), status = document.getElementById('status');
  inp.value = moedas.join(',');
  const fmt = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtBig = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });

  async function atualizar() {
    try {
      const r = await fetch(`https://economia.awesomeapi.com.br/last/${moedas.map(m => m + '-BRL').join(',')}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const itens = moedas.map(m => d[m + 'BRL']).filter(Boolean);
      grid.innerHTML = itens.map(c => {
        const bid = +c.bid, pct = +c.pctChange, cls = pct >= 0 ? 'up' : 'down';
        return `<div class="card"><div class="code">${c.code}/BRL</div>
          <div class="bid"><small>R$</small>${bid >= 1000 ? fmtBig.format(bid) : fmt.format(bid)}</div>
          <div class="pct ${cls}">${pct >= 0 ? '▲' : '▼'} ${fmt.format(Math.abs(pct))}%</div></div>`;
      }).join('');
      document.title = itens.map(c => `${c.code} ${+c.bid >= 1000 ? fmtBig.format(+c.bid) : fmt.format(+c.bid)}`).join(' · ');
      status.textContent = 'Atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      status.className = '';
    } catch (e) {
      status.textContent = 'Sem conexão — mostrando último valor';
      status.className = 'err';
    }
  }
  inp.addEventListener('change', () => {
    moedas = inp.value.toUpperCase().replace(/[^A-Z,]/g, '').split(',').filter(Boolean);
    inp.value = moedas.join(',');
    localStorage.setItem(KEY, inp.value);
    history.replaceState(null, '', location.pathname);
    atualizar();
  });
  atualizar();
  setInterval(atualizar, 30000);
</script>
</body>
</html>
